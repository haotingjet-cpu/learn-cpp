name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - main # 如果你的預設分支是 master，請改為 master

# 給予此工作流寫入權限以部署到 GitHub Pages
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✨ 推薦改用這個官方/社群維護的 Action，會自動幫你下載並安裝好最新的 mdBook
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest' # 自動抓取最新穩定版，也可以指定如 '0.4.40'

      - name: Build mdBook
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book # mdBook 預設產生的網頁資料夾
